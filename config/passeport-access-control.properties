# Fichier de config du SystemAccessControl custom (plugin starburst-cnam-passeport)
# À déposer dans etc/ du coordinateur (nom de fichier libre, ex: etc/passeport-access-control.properties)
# et référencer dans etc/config.properties via :
#   access-control.config-files=etc/<fichier-biac-existant>.properties,etc/passeport-access-control.properties
#
# ⚠️ Le nom exact du fichier BIAC existant sur ce cluster (Helm) n'a pas été vérifié dans cette session —
# à confirmer côté values.yaml / ConfigMap avant application.

access-control.name=passeport

# Mapping table -> colonne à filtrer (v1 : liste statique en config, cf. note du 14/09)
passeport.row-filter-mappings=iceberg.coeurdata.vact:caiexe_act,iceberg.coeurdata.vpra:pracai_pra,iceberg.coeurdata.vpij:caiorg_pij,iceberg.coeurdata.vprn_bdo:gescai_prn

# Table de périmètre — DOIT être surchargé, le défaut "system" du code ne fonctionne pas (catalog en lecture seule)
passeport.perimetre-catalog=postgres
passeport.perimetre-schema=security_control
passeport.perimetre-table=user_perimetre
